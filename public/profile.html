<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-md max-w-md w-full space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">👤 ข้อมูลส่วนตัว</h1>
            <p class="text-sm text-slate-500 mt-1">เปลี่ยนรหัสผ่านเข้าใช้งานระบบ</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่านใหม่ (New Password)</label>
                <input type="password" id="newPassword" placeholder="กรอกรหัสผ่านใหม่" class="w-full border px-4 py-2.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ยืนยันรหัสผ่านใหม่ (Confirm Password)</label>
                <input type="password" id="confirmPassword" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" class="w-full border px-4 py-2.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="changePassword()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">
                บันทึกการเปลี่ยนรหัสผ่าน
            </button>
        </div>

        <div class="pt-4 border-t text-center">
            <button onclick="goBack()" class="text-sm text-slate-600 hover:underline">◀ กลับสู่หน้าหลัก</button>
        </div>
    </div>

    <script>
        async function changePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || !confirmPassword) return alert('กรุณากรอกรหัสผ่านให้ครบถ้วน');
            if (newPassword !== confirmPassword) return alert('รหัสผ่านใหม่ไม่ตรงกัน');

            const res = await fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword })
            });

            const data = await res.json();
            if (data.success) {
                alert('เปลี่ยนรหัสผ่านสำเร็จเรียบร้อย');
                goBack();
            } else {
                alert(data.error || 'เกิดข้อผิดพลาด');
            }
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
