<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-100 p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
            <h1 class="text-2xl font-bold text-slate-800">👑 Admin Dashboard</h1>
            <div class="space-x-2">
                <a href="/profile.html" class="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium">Profile</a>
                <button onclick="logout()" class="bg-rose-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium">Logout</button>
            </div>
        </div>

        <!-- Section 1: Upload JSON -->
        <div class="bg-white p-6 rounded-xl shadow space-y-3">
            <h2 class="text-lg font-bold text-slate-700">📤 1. อัปโหลดชุดโจทย์แบบฝึกหัด (.JSON)</h2>
            <div class="flex gap-3">
                <input type="file" id="jsonFile" accept=".json" class="block border p-2 rounded-lg text-sm flex-1">
                <button onclick="uploadJSON()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700">Upload</button>
            </div>
        </div>

        <!-- Section 2: Manage Active Subjects -->
        <div class="bg-white p-6 rounded-xl shadow space-y-3">
            <h2 class="text-lg font-bold text-slate-700">⚙️ 2. จัดการวิชาที่เปิดให้นักเรียนทำ (Active / Inactive)</h2>
            <div id="subjectList" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </div>

        <!-- Section 3: Questions List -->
        <div class="bg-white p-6 rounded-xl shadow space-y-4">
            <h2 class="text-lg font-bold text-slate-700">📚 3. รายการโจทย์ในฐานข้อมูลทั้งหมด</h2>
            <div id="questionsContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-2"></div>
        </div>
    </div>

    <script>
        async function loadSubjects() {
            const res = await fetch('/api/admin/subjects');
            const data = await res.json();
            document.getElementById('subjectList').innerHTML = data.map(s => `
                <label class="flex items-center space-x-3 p-3 border rounded-xl bg-slate-50 cursor-pointer hover:bg-slate-100">
                    <input type="checkbox" ${s.is_active ? 'checked' : ''} onchange="toggleSubject('${s.subject_name}', this.checked)" class="w-5 h-5 text-indigo-600 rounded">
                    <span class="font-bold text-slate-800">${s.subject_name}</span>
                </label>
            `).join('');
        }

        async function toggleSubject(subject_name, is_active) {
            await fetch('/api/admin/toggle-subject', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ subject_name, is_active })
            });
        }

        async function uploadJSON() {
            const file = document.getElementById('jsonFile').files[0];
            if(!file) return alert('กรุณาเลือกไฟล์ JSON ก่อน');
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch('/api/admin/upload-json', { method: 'POST', body: formData });
            const data = await res.json();
            if(data.success) {
                alert(`อัปโหลดสำเร็จทั้งหมด ${data.count} ข้อ`);
                loadSubjects();
                loadQuestions();
            } else alert(data.error);
        }

        async function loadQuestions() {
            const res = await fetch('/api/admin/questions');
            const data = await res.json();
            document.getElementById('questionsContainer').innerHTML = data.map((q, i) => `
                <div class="border p-4 rounded-xl space-y-2 bg-slate-50">
                    <div class="flex justify-between text-xs text-slate-500 font-bold">
                        <span>[${q.subject.toUpperCase()}] ${q.topic}</span>
                        <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-700">${q.difficulty}</span>
                    </div>
                    <div class="font-medium text-slate-800">ข้อ ${i+1}: ${q.question}</div>
                    <div class="grid grid-cols-2 gap-2 text-sm pt-2">
                        ${q.choices.map((c, idx) => `
                            <div class="p-2 border rounded ${idx === q.correct_choice ? 'bg-emerald-100 border-emerald-400 font-bold text-emerald-800' : 'bg-white'}">
                                ${['A','B','C','D'][idx]}. ${c}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            setTimeout(() => renderMathInElement(document.body), 100);
        }

        function logout() {
            fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/index.html');
        }

        loadSubjects();
        loadQuestions();
    </script>
</body>
</html>
