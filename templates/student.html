<!DOCTYPE html>
<html>
<head>
    <title>MathQuiz - Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div id="app" class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">
        <!-- หน้าแรก: ใส่ชื่อ -->
        <div id="setup-area">
            <h1 class="text-2xl font-bold mb-4">เข้าสอบ MathQuiz</h1>
            <input type="text" id="student-name" placeholder="ชื่อ-นามสกุล" class="w-full p-2 border rounded mb-4">
            <button onclick="checkStatus()" class="w-full bg-blue-600 text-white p-2 rounded">เข้าสู่ห้องสอบ</button>
        </div>

        <!-- หน้าคอย: รอครูเริ่ม -->
        <div id="wait-area" class="hidden text-center py-10">
            <div class="animate-spin text-4xl mb-4">⏳</div>
            <p class="text-lg">รอคุณครูเปิดระบบข้อสอบ...</p>
        </div>

        <!-- หน้าทำข้อสอบ -->
        <div id="quiz-area" class="hidden">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="quiz-title" class="font-bold text-xl"></h2>
                <div id="timer" class="text-red-600 font-mono text-xl"></div>
            </div>
            <div id="question-container"></div>
            <button onclick="submitQuiz()" class="mt-6 w-full bg-green-600 text-white p-3 rounded-lg font-bold">ส่งคำตอบ</button>
        </div>

        <!-- หน้าสรุปผล -->
        <div id="result-area" class="hidden">
            <h2 class="text-2xl font-bold text-center text-blue-700">ส่งคำตอบเรียบร้อย!</h2>
            <div id="score-display" class="text-center text-4xl my-6"></div>
            <div id="review-container" class="space-y-4"></div>
        </div>
    </div>

    <script>
        let quizData = null;
        let timerInterval = null;

        async function checkStatus() {
            const name = document.getElementById('student-name').value;
            if(!name) return alert("กรุณาใส่ชื่อ");

            const res = await fetch('/api/quiz-status');
            const status = await res.json();

            if(status.is_live) {
                startQuiz();
            } else {
                document.getElementById('setup-area').classList.add('hidden');
                document.getElementById('wait-area').classList.remove('hidden');
                setTimeout(checkStatus, 3000); // Check every 3s
            }
        }

        async function startQuiz() {
            const res = await fetch('/api/get-quiz');
            quizData = await res.json();
            
            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('wait-area').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            document.getElementById('quiz-title').innerText = quizData.title;

            renderQuestions();
            startTimer(quizData.remaining);
        }

        function renderQuestions() {
            const container = document.getElementById('question-container');
            container.innerHTML = quizData.questions.map((q, idx) => `
                <div class="mb-8 p-4 bg-gray-50 rounded border">
                    <p class="font-semibold mb-3">${idx+1}. ${q.question}</p>
                    <div class="space-y-2">
                        ${q.choices.map((c, i) => `
                            <label class="flex items-center space-x-3 p-2 border rounded cursor-pointer hover:bg-white">
                                <input type="radio" name="q-${q.id}" value="${i}">
                                <span>${c}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            MathJax.typeset();
        }

        function startTimer(seconds) {
            const display = document.getElementById('timer');
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(seconds <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                    return;
                }
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                display.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                seconds--;
            }, 1000);
        }

        async function submitQuiz() {
            clearInterval(timerInterval);
            const name = document.getElementById('student-name').value;
            const answers = {};
            quizData.questions.forEach(q => {
                const selected = document.querySelector(`input[name="q-${q.id}"]:checked`);
                if(selected) answers[q.id] = parseInt(selected.value);
            });

            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({student_name: name, answers: answers})
            });
            const result = await res.json();
            showResults(result);
        }

        function showResults(res) {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('score-display').innerText = `คะแนนที่ได้: ${res.score} / ${res.total}`;
            // Optional: Review answers logic here
        }
    </script>
</body>
</html>
