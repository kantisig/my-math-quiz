<!DOCTYPE html>
<html>
<head>
    <title>MathQuiz - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8 bg-slate-800 p-6 rounded-xl shadow-lg">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">Teacher Dashboard</h1>
                <p id="quiz-status-text" class="text-gray-400">สถานะ: ยังไม่ได้อัปโหลดข้อสอบ</p>
            </div>
            <div class="flex gap-3">
                <input type="file" id="fileInput" class="hidden" onchange="uploadFile()">
                <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">อัปโหลด JSON</button>
                <button onclick="startExam()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">เริ่มการสอบ</button>
                <button onclick="stopExam()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded">จบการสอบ</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- สถิติทั่วไป -->
            <div class="bg-slate-800 p-6 rounded-xl text-center">
                <p class="text-gray-400">นักเรียนที่ส่งแล้ว</p>
                <h2 id="count-students" class="text-5xl font-bold mt-2">0</h2>
            </div>
            <!-- กราฟคะแนน -->
            <div class="md:col-span-2 bg-slate-800 p-6 rounded-xl">
                <canvas id="scoreChart" height="100"></canvas>
            </div>
        </div>

        <div class="mt-8 bg-slate-800 p-6 rounded-xl">
            <h3 class="text-xl font-bold mb-4 text-orange-400">วิเคราะห์ข้อที่เด็กตอบผิด (Error Ranking)</h3>
            <div id="error-list" class="space-y-3">
                <p class="text-gray-500 italic">ยังไม่มีข้อมูลการส่งคำตอบ...</p>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let chart;

        function connectWS() {
            ws = new WebSocket(`ws://${location.host}/ws/teacher`);
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if(data.type === 'INIT' || data.type === 'NEW_SUBMISSION') {
                    updateDashboard(data.analytics);
                }
            };
        }

        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            const formData = new FormData();
            formData.append('file', file);
            await fetch('/api/upload', {method: 'POST', body: formData});
            alert("อัปโหลดสำเร็จ!");
        }

        async function startExam() {
            const duration = prompt("กำหนดเวลาสอบ (นาที):", "15");
            await fetch('/api/start-timer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({duration: duration})
            });
        }

        async function stopExam() {
            if(confirm("ต้องการจบการสอบทันทีหรือไม่?")) {
                await fetch('/api/stop-timer', {method: 'POST'});
            }
        }

        function updateDashboard(analytics) {
            if(!analytics || !analytics.histogram) return;
            
            document.getElementById('count-students').innerText = analytics.total_students;
            
            // Update Chart
            const ctx = document.getElementById('scoreChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: analytics.histogram.map((_, i) => i + " คะแนน"),
                    datasets: [{ label: 'จำนวนนักเรียน', data: analytics.histogram, backgroundColor: '#3b82f6' }]
                },
                options: { scales: { y: { beginAtZero: true, ticks: {stepSize: 1} } } }
            });

            // Update Error List
            const list = document.getElementById('error-list');
            list.innerHTML = analytics.error_ranking.map(item => `
                <div class="flex justify-between items-center bg-slate-700 p-3 rounded">
                    <span class="truncate mr-4">${item.question}</span>
                    <span class="text-red-400 font-bold">ผิด ${item.error_rate}%</span>
                </div>
            `).join('');
        }

        connectWS();
    </script>
</body>
</html>
